---
layout: default
---
<article class="wrap page">
  {%- if page.title %}
  <header class="page__header">
    <h1 class="page__title">{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="page__lead">{{ page.lead }}</p>
    {%- endif %}
  </header>
  {%- endif %}
  <div class="page__content prose">
    {{ content }}
  </div>
</article>
